name: Mobilize
description: 'Mobilize (mobilize.io) is a community and learning software platform purpose-built
  for associations and professional networks, now operating under the Forj brand (forj.ai).
  The platform unifies member community and continuing education in one place through its
  products Forj Connect (peer-to-peer and group member communication), Forj Learn (a learning
  management system for continuing education, certification, and social learning), and Journey
  by Forj (a combined community-and-learning experience). Mobilize was surfaced as a portfolio
  company of Trinity Ventures. As of this enrichment pass the company publishes a member/admin
  web application (app.mobilize.io) and a Zendesk help center but no public developer API,
  OpenAPI specification, or developer portal, so this profile carries verified company identity
  and link properties rather than API artifacts.'
